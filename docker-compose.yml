# Local full-stack run: PostgreSQL, the Spring Boot API and the nginx-served frontend.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mashkanta
      POSTGRES_USER: mashkanta
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-mashkanta}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mashkanta"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DATABASE_URL: jdbc:postgresql://db:5432/mashkanta
      DATABASE_USER: mashkanta
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-mashkanta}
      # The frontend is served same-origin through nginx, so no cross-origin caller is expected.
      APP_CORS_ALLOWED_ORIGINS: ""
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8081:80"

volumes:
  db-data:

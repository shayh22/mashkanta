server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Hashed asset filenames are immutable, so they can be cached indefinitely. index.html is not
    # hashed and must never be cached, or a deploy leaves browsers pointing at deleted bundles.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # The API is proxied rather than called cross-origin, which keeps CORS out of production
    # entirely: to the browser the whole application is one origin.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        client_max_body_size 12M;
    }

    # Single-page app: unknown paths render the shell and let the client route.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
}

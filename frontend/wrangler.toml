# Deployed as a Worker serving static assets — the shape Cloudflare's build pipeline uses when the
# deploy command is `npx wrangler deploy`.
#
# There is deliberately no `main` entry point: the whole app is static, so no Worker script runs and
# asset requests are served straight from Cloudflare's edge.
name = "mashkanta"
compatibility_date = "2026-09-01"

# Publish on <name>.<subdomain>.workers.dev. This is the documented default, but it is stated
# explicitly so a deploy cannot end up with no reachable URL because something upstream flipped it.
# The account must also have claimed a workers.dev subdomain — that part is a dashboard action.
workers_dev = true

[assets]
directory = "./dist"
# Unmatched paths render the SPA shell and let the client route them. This is the native mechanism,
# used instead of a catch-all rule in _redirects so it cannot shadow real asset paths.
not_found_handling = "single-page-application"

# Deployed as a Worker serving static assets — the shape Cloudflare's build pipeline uses when the
# deploy command is `npx wrangler deploy`.
#
# The app itself is static and asset requests are served straight from Cloudflare's edge. The one
# exception is `/api/*`: the Worker in `worker/index.ts` reads live market figures from the Bank of
# Israel, whose statistics service does not answer cross-origin browser requests.
name = "mashkanta"
main = "worker/index.ts"
compatibility_date = "2026-09-01"

# Publish on <name>.<subdomain>.workers.dev. This is the documented default, but it is stated
# explicitly so a deploy cannot end up with no reachable URL because something upstream flipped it.
# The account must also have claimed a workers.dev subdomain — that part is a dashboard action.
workers_dev = true

# The app's own address on the owner's domain. `custom_domain` makes Cloudflare create the DNS record
# and certificate on deploy; the zone must be in the same account. workers.dev keeps working too.
routes = [
  { pattern = "mashkanta.birkat-hanasi.com", custom_domain = true },
]

[assets]
directory = "./dist"
# Unmatched paths render the SPA shell and let the client route them. This is the native mechanism,
# used instead of a catch-all rule in _redirects so it cannot shadow real asset paths.
not_found_handling = "single-page-application"
binding = "ASSETS"
# Only these paths run the Worker; everything else never touches it.
run_worker_first = ["/api/*"]
